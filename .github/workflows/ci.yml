name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  packaging-test:
    name: Release packaging contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install just for bundle recipe contracts
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - run: python -m unittest discover -s scripts -p 'test_release*.py' -v

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python for bridge evidence
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-test-
            ${{ runner.os }}-target-

      # surge-ui (GPUI desktop shell) links libxcb/libxkbcommon at build time.
      # Ubuntu-only: macOS and Windows have their own native windowing libs
      # and are not addressed here, so surge-ui stays excluded for them below
      # — deliberately, not by omission.
      - name: Install surge-ui system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev libfontconfig1-dev

      # Ordinary daemon fixtures launch this binary on every matrix platform.
      # Building test targets alone does not create target/debug/mock_acp_agent.
      - name: Build mock_acp_agent for engine integration tests
        run: cargo build --locked -p surge-acp --bin mock_acp_agent

      - name: Test bridge evidence runner
        run: python -m unittest discover -s scripts -p 'test_bridge_portability.py' -v

      - name: Record native ACP bridge portability
        run: python scripts/bridge_portability.py --output "${{ runner.temp }}/bridge-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
        timeout-minutes: 45

      - name: Upload native ACP bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-portability-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      # Fixed causal observation only; the unchanged full suite still runs on failure.
      - name: Test fixed Windows observation checker
        id: wg7_checker
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python -m unittest discover -s scripts -p 'test_wg7_windows_observation.py' -v

      - name: Observe five Windows cases before the full suite
        id: wg7_focused
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python scripts/wg7_windows_observation.py capture --output "${{ runner.temp }}/wg7-observation-${{ github.run_id }}-${{ github.run_attempt }}"
        timeout-minutes: 45

      - name: Upload early Windows observation evidence
        id: wg7_early_upload
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wg7-observation-before-full-${{ github.sha }}
          path: ${{ runner.temp }}/wg7-observation-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      # `cargo nextest` is ~1.5-2x faster than `cargo test` and runs each test
      # in its own process by default, which avoids parallel SQLite/WAL races
      # we hit on Windows under the old harness.
      #
      # surge-ui runs in the workspace suite on ubuntu-latest only (system
      # libs installed above); macOS/Windows keep the exclude.
      - name: Run tests (nextest, incl. surge-ui)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --no-fail-fast

      - name: Run tests (nextest)
        id: full_native_suite
        if: matrix.os != 'ubuntu-latest'
        run: cargo nextest run --locked --workspace --exclude surge-ui --no-fail-fast

      - name: Verify Windows observation identities after the full suite
        id: wg7_identity
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        run: python scripts/wg7_windows_observation.py verify --output "${{ runner.temp }}/wg7-observation-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Probe native NTFS durability as a standard user (Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows-native-probe.ps1
        timeout-minutes: 10

      - name: Upload Windows standard-user evidence
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-standard-user-${{ github.sha }}
          path: ${{ runner.temp }}/surge-standard-user-evidence-*/
          if-no-files-found: error

      # nextest does not run doctests; the canonical workaround is a single
      # extra `cargo test --locked --doc` invocation. Cheap because no recompilation.
      - name: Run doctests (incl. surge-ui)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --doc

      - name: Run doctests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked --workspace --exclude surge-ui --doc

      - name: Build local integration helpers
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked -p surge-cli --bin surge -p surge-daemon --bin surge-daemon

      - name: Build mock MCP server
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked -p surge-mcp --example mock_mcp_server --features mock-server

      # Explicit local-only allowlist: external runtimes and empty placeholder
      # tests must not be counted as release evidence.
      - name: Run mock ACP integration tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p surge-acp --test bridge_rate_limit_classification --test reconnect_integration_test -- --ignored
        timeout-minutes: 10

      - name: Run mock engine integration tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p surge-orchestrator --test engine_e2e_linear_pipeline --test engine_concurrent_runs --test engine_resume_after_crash -- --ignored
        timeout-minutes: 10

      - name: Run mock MCP integration tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p surge-mcp --features mock-server --test mcp_stdio_e2e -- --ignored
        timeout-minutes: 10

      - name: Run controlled daemon MCP smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p surge-daemon --test live_provider_smoke controlled_daemon_mcp_smoke -- --ignored --exact
        timeout-minutes: 10

      - name: Run daemon restart integration tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p surge-cli --test daemon_restart -- --ignored
        timeout-minutes: 10

      - name: Upload final Windows observation evidence
        id: wg7_final_upload
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wg7-observation-after-full-${{ github.sha }}
          path: ${{ runner.temp }}/wg7-observation-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      - name: Enforce actual Windows observation and full-suite outcomes
        if: always() && matrix.os == 'windows-latest'
        env:
          WG7_OUTCOMES: >-
            {"checker":"${{ steps.wg7_checker.outcome }}","focused":"${{ steps.wg7_focused.outcome }}","early_upload":"${{ steps.wg7_early_upload.outcome }}","full":"${{ steps.full_native_suite.outcome }}","identity":"${{ steps.wg7_identity.outcome }}","final_upload":"${{ steps.wg7_final_upload.outcome }}"}
        shell: pwsh
        run: python scripts/wg7_windows_observation.py enforce --output "${{ runner.temp }}/wg7-observation-${{ github.run_id }}-${{ github.run_attempt }}" --outcomes $env:WG7_OUTCOMES

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target/
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-
            ${{ runner.os }}-target-

      # The workspace pass below builds surge-ui (GPUI), which needs the
      # same Linux system libraries as the test job (fontconfig via the text stack).
      - name: Install surge-ui system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev libfontconfig1-dev

      # Strict: M1's surge-core crate must be warning-free.
      - name: Run clippy (strict on surge-core)
        run: cargo clippy --locked -p surge-core --all-targets --all-features -- -D warnings

      # Strict: M3's surge-acp crate (bridge::* + shared::*) must be warning-free.
      - name: Run clippy (strict on surge-acp)
        run: cargo clippy --locked -p surge-acp --all-targets -- -D warnings

      - name: Run clippy (strict workspace, all features)
        run: cargo clippy --locked --keep-going --workspace --all-targets --all-features -- -D warnings

      - name: Run clippy (strict workspace, default features)
        run: cargo clippy --locked --keep-going --workspace --all-targets -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The workspace declares rust-version = "1.96" (tracks current stable;
      # the hard lower bound from deps + surge-acp's `round_char_boundary` is
      # ~1.91). This job pins that toolchain and type-checks the whole
      # workspace so an accidental use of a newer-than-MSRV std/language
      # feature is caught at the gate. surge-ui stays excluded here on its
      # own, independent rationale (GPUI pulls bleeding-edge toolchain
      # features and is not part of the MSRV contract) — unlike the `test`
      # job's exclusion, this one was never about missing system libraries,
      # so installing them there (see the `test` job above) does not lift
      # it here too. Not reverified against 1.96: flipping it risks failing
      # this gate for a toolchain-feature reason that change did not scope
      # in, so it was left alone rather than guessed at.
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check --locked (MSRV)
        run: cargo check --locked --workspace --exclude surge-ui --all-targets

  bench:
    name: Engine Bench (stage transition)
    # Linux-only — bench wall-clock numbers across runners are not comparable.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-bench-
            ${{ runner.os }}-target-

      # Compile-only smoke: full bench is too slow for the PR gate; the GA
      # cut runs `cargo bench --locked --bench stage_transition -- --save-baseline ga`
      # locally. CI builds the bench so a bench-breaking change cannot land
      # silently.
      - name: Build stage_transition bench
        run: cargo bench --locked -p surge-orchestrator --bench stage_transition --no-run

      # Quick smoke run with the explicit P95 gate enabled. `--save-baseline ci`
      # keeps Criterion history available on the runner, while
      # SURGE_STAGE_TRANSITION_BUDGET_CHECK makes the bench fail if the
      # source-level P95_BUDGET_US budget is exceeded.
      - name: Budget-check stage_transition bench
        env:
          SURGE_STAGE_TRANSITION_BUDGET_CHECK: "1"
        run: cargo bench --locked -p surge-orchestrator --bench stage_transition -- --quick --save-baseline ci

  security:
    name: Current dependency security and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Audit current RustSec advisories
        run: cargo audit
      - name: Validate locked dependency policy
        run: cargo deny --locked check advisories licenses bans sources
