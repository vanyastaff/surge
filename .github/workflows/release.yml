name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validation:
    name: Validate release revision
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  metadata:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        name: Validate release tag against workspace version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python scripts/release.py metadata --ref "$RELEASE_REF" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.target }}
    needs: [metadata, validation]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # Explicit native runners: macos-latest is Apple Silicon.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Configure self-contained macOS OpenSSL linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Build both release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --package surge-cli --package surge-daemon
      - name: Reject external macOS runtime libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in surge surge-daemon; do
            dependencies=$(otool -L "target/${{ matrix.target }}/release/$binary")
            printf '%s\n' "$dependencies"
            unexpected=$(printf '%s\n' "$dependencies" | tail -n +2 | awk '{print $1}' | awk '!/^\/usr\/lib\// && !/^\/System\/Library\//')
            if [ -n "$unexpected" ]; then
              printf 'Unbundled runtime libraries in %s:\n%s\n' "$binary" "$unexpected" >&2
              exit 1
            fi
          done
      - name: Strip Unix binaries
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/surge target/${{ matrix.target }}/release/surge-daemon
      - name: Package both binaries and licenses
        run: python scripts/release.py package --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release --output dist
      - name: Extract and smoke-test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir smoke
          tar -xzf dist/surge-${{ matrix.target }}.tar.gz -C smoke
          ./smoke/surge --version
          ./smoke/surge-daemon --version
      - name: Extract and smoke-test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/surge-${{ matrix.target }}.zip smoke
          & ./smoke/surge.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./smoke/surge-daemon.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: surge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  collect:
    name: Verify release set and checksums
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: surge-*
          path: artifacts
      - run: python scripts/release.py collect --input artifacts --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish validated tag
    needs: [metadata, validation, collect]
    if: startsWith(github.ref, 'refs/tags/') && needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
