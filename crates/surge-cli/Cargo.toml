[package]
name = "surge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "surge"
path = "src/main.rs"

[dependencies]
surge-process = { workspace = true }
surge-core = { workspace = true }
surge-mcp = { workspace = true }
surge-acp = { workspace = true }
surge-git = { workspace = true }
surge-orchestrator = { workspace = true }
surge-persistence = { workspace = true }
surge-notify = { workspace = true }
surge-intake = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
agent-client-protocol = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
owo-colors = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
surge-daemon = { workspace = true }
rusqlite = { workspace = true }
semver = { workspace = true }
# `surge mcp serve` exposes Surge as an MCP *server* over stdio; the workspace
# entry only enables the client half.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
which = "6"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
tokio-util = { workspace = true, features = ["rt"] }
git2 = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"
insta = { workspace = true }
