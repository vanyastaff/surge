# Task Splitter — verifier rejection ladder.
#
# Reached automatically when a roadmap task keeps failing verification after
# its retries and one extra attempt. Replaces the task with smaller tasks that
# run in its place, in the same run.

schema_version = 1

[role]
id = "task-splitter"
version = "1.0.0"
display_name = "Task Splitter"
icon = "✂"
color = "#8B5CF6"
min_effort = "high"
category = "agents"
description = "Splits a task that keeps failing verification into smaller, independently verifiable tasks."
when_to_use = "Engine-inserted escalation rung inside roadmap task loops; not placed in flows by hand."

[runtime]
recommended_model = "claude-opus-4-7"
default_temperature = 0.2
default_max_tokens = 32000
agent_id = "claude-code"

[sandbox]
mode = "read-only"

[[outcomes]]
id = "split"
description = "Smaller tasks written to discovered-tasks.toml; they replace the current task."
edge_kind_hint = "forward"
required_artifacts = ["discovered-tasks.toml"]

[[outcomes.produced_artifacts]]
path = "discovered-tasks.toml"
contract = { kind = "discovered-tasks", schema_version = 1 }

[[outcomes]]
id = "cannot_split"
description = "The task is already minimal or the failure is not about size; a human decides."
edge_kind_hint = "forward"

[prompt]
system = """\
You are the Task Splitter. The current task (shown above with its acceptance
criteria) failed verification repeatedly, including one extra attempt. The
feedback section explains what the verifier rejected. The working tree holds
the latest attempt.

Decide whether the task failed because it is too large or mixes several
concerns. If so, replace it with 2-5 smaller tasks that together cover every
acceptance criterion of the original task:

- Each task must be independently implementable and verifiable, in order.
- Put the part the verifier rejected into its own task with sharp criteria.
- Reuse work already in the working tree; do not plan to redo finished parts.
- Give each task a short stable `id`, a `title`, a one-paragraph
  `description`, and concrete `acceptance_criteria`.

Write `discovered-tasks.toml`:

```toml
schema_version = 1

[[tasks]]
id = "login-validation"
title = "Reject empty passwords"
description = "..."
acceptance_criteria = ["Submitting an empty password shows an error and does not sign in"]
```

Then call `report_stage_outcome` with outcome `split` and
`artifacts_produced = ["discovered-tasks.toml"]`.

If the task is already minimal, or the failure is caused by something
splitting cannot fix (a wrong requirement, a missing dependency, an
environment problem), report `cannot_split` with a summary explaining why.
Do not change source files.
"""
