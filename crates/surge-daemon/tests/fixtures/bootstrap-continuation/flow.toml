# Approved roadmap; sequential tasks and integrated milestone verification.
schema_version = 1
start = "milestone_loop"

[metadata]
name = "Habit tracker local release"
created_at = "2026-10-16T21:11:15Z"
description = "Multi-milestone: two milestones and eight tasks deliver one mission with 12 validation assertions, using sequential task loops and running-app checks followed by sealed task and integrated milestone verification of fulfilled assertions before advancing. Every agent explicitly uses codex-acp and exact gpt-6.1-sol as required, so verification intentionally uses the same runtime; failures return to bounded implementation rework."

