schema_version = 2
stages_rationale = "One stage: both ordered milestones contribute to one complete local release, with the usable daily tracker demonstrated before persistence and filtering are added."

[[missions]]
id = "mission-1"
title = "Usable local habit tracker"
goal = "Deliver a runnable local application for creating habits and tracking completion by local calendar date, then retain those records across reloads and filter today's list. Execute both milestones with documented commands and visible verification evidence while preserving history and artifacts for the separate follow-up."
milestones = ["m1", "m2"]

[[missions.validation_contract]]
id = "VAL-HABIT-001"
title = "Create and display habits with correctable validation"
pass_condition = "Submitting a named habit displays it in the list; empty and whitespace-only submissions create no habit, explain the validation problem, and let the user correct and resubmit the input."
evidence = ["Executed automated tests for valid creation, empty input, whitespace-only input, and successful correction", "Rendered interface showing the created habit and validation message"]

[[missions.validation_contract]]
id = "VAL-EMPTY-001"
title = "Guide a user with no habits"
pass_condition = "With no habits, the interface explains that the list is empty and how to add the first habit; adding a habit replaces this state with the habit list."
evidence = ["Executed empty-list and first-creation tests", "Screenshot or recorded UI inspection of the initial empty state"]

[[missions.validation_contract]]
id = "VAL-DAY-001"
title = "Independent completion by local calendar day"
pass_condition = "A user can check and uncheck either of two habits independently, with an understandable current state. Advancing to a new local calendar date, including while the app remains open, shows that date's state; changing it leaves prior dates intact, and revisiting a prior date restores its recorded state."
evidence = ["Executed tests for independent check/uncheck, local-date boundary including a case where UTC and local dates differ, and rollover without reload", "Executed tests showing records for multiple dates survive later changes"]

[[missions.validation_contract]]
id = "VAL-ACCESS-001"
title = "Keyboard operation of the first milestone"
pass_condition = "In milestone 1, keyboard users can create and correct a habit and check or uncheck it in logical focus order with visible focus. Inputs and toggles have accessible names; completion is exposed programmatically and understandable without color alone."
evidence = ["Executed tests of form labels, validation association, and toggle state", "Recorded keyboard-only inspection of milestone 1, including visible focus"]

[[missions.validation_contract]]
id = "VAL-DELIVERY-001"
title = "Demonstrate the first runnable milestone before the second"
pass_condition = "Before milestone 2 starts, milestone 1 runs locally with documented prerequisite, installation, startup, and test commands; creation, validation, empty state, date-specific toggling, and accessible interaction have actual passing checks and visible implementation evidence in the Flow/task history."
evidence = ["Milestone 1 implementation revision and changed-file references", "Actual commands, exit results, and automated versus manual check records", "Milestone 1 completion recorded before milestone 2 begins"]

[[missions.validation_contract]]
id = "VAL-PERSIST-001"
title = "Retain habits and dated completions across reloads"
pass_condition = "After creating multiple habits and changing completions on multiple local dates, reloading retains the habits and each date's records. Returning on another day shows that day's independent state while retaining earlier records; a persisted uncheck also survives reload."
evidence = ["Executed browser reload tests using retained storage for creation, check, uncheck, and multiple local dates"]

[[missions.validation_contract]]
id = "VAL-PERSIST-002"
title = "Expose storage failures and recover safely"
pass_condition = "An unreadable or invalid saved record and a failed write each produce an understandable message and an actionable recovery path. A failed write is never presented as successfully saved; after recovery, a successful save and reload demonstrate durability, and unreadable existing data is not silently overwritten."
evidence = ["Executed tests injecting read failure, invalid stored data, and write failure", "Executed recovery tests and UI inspection showing accurate save status and recovery controls"]

[[missions.validation_contract]]
id = "VAL-FILTER-001"
title = "Filter today's habits without data loss"
pass_condition = "Clearly labeled All, Completed today, and Incomplete today filters show the matching habits for the current local date and reflect completion changes and date rollover. A filter with no matches has a distinct explanation; switching filters and reloading retains habits and dated records."
evidence = ["Executed tests for all filter modes, toggle-driven updates, date rollover, and no-match versus empty-list states", "Executed filtering-to-reload integration test proving retained data"]

[[missions.validation_contract]]
id = "VAL-ACCESS-002"
title = "Keyboard access across the complete application"
pass_condition = "Keyboard users can complete creation, validation correction, independent check/uncheck, filter selection, and storage recovery. Focus order is logical, focus remains usable when a filtered habit disappears, focus is visible, controls have accessible names and states, and completion and errors are understandable without color alone."
evidence = ["Executed keyboard and accessible-name/state tests covering filters, dynamic list changes, validation, and recovery", "Recorded manual keyboard-only inspection of all final flows and visible focus"]

[[missions.validation_contract]]
id = "VAL-LOCAL-001"
title = "Reproduce local use from documentation"
pass_condition = "Following the final documented prerequisites, install, startup, and automated-test commands from a fresh checkout launches the complete app and runs its checks. Documentation explains storage location and scope, reload and date behavior, recovery, and material local-use limits."
evidence = ["Final local-use documentation", "Recorded execution of documented commands with environment prerequisites and actual results"]

[[missions.validation_contract]]
id = "VAL-DELIVERY-002"
title = "Deliver implementation and truthful verification with continuity"
pass_condition = "The final project contains working source and meaningful executed automated tests for creation, invalid input, independent toggling, dates, reload persistence, filtering, and empty/error states. Flow/task history records implementation revisions, commands, actual results, automated versus manual accessibility checks, and any limitations for both milestones; existing history and generated artifacts remain available for the follow-up."
evidence = ["Final implementation revision and test output", "Per-milestone Flow/task evidence with automated and manual checks distinguished", "Retained description, roadmap, subsequent generated artifacts, and repository history"]

[[missions.validation_contract]]
id = "VAL-FLOW-001"
title = "Use the required runtime and exact model throughout"
pass_condition = "Every agent stage in the generated Flow explicitly sets runtime codex-acp and exact model gpt-6.1-sol, without relying on inherited settings; the executed stage history agrees with those settings."
evidence = ["Generated Flow configuration for every agent stage", "Execution metadata confirming runtime and model for every executed agent stage"]

[[stages]]
id = "stage-1"
title = "Complete local release"
goal = "Ship the daily tracker through two usable, verified increments and retain the complete delivery record."
milestones = ["m1", "m2"]
exit_criteria = [
  "Milestone 1 is implemented, runnable, and verified before milestone 2 starts.",
  "The complete app passes the mission validation contract for dated tracking, persistence, filtering, accessibility, recovery, and documented local use.",
  "Both milestones have actual implementation and check evidence in retained Flow/task history, and every generated agent stage explicitly uses codex-acp with gpt-6.1-sol."
]

[[milestones]]
id = "m1"
title = "Create habits and track today's completion"

[[milestones.tasks]]
id = "m1-t1"
title = "Establish a runnable local application"
size = "s"
description = "Select a suitable ordinary web application stack and establish the smallest runnable application with automated-check entry points. Preserve existing repository and bootstrap artifacts."
acceptance_criteria = [
  "The chosen stack and local prerequisites are recorded, and documented install and startup commands display the application locally.",
  "An automated-test command runs successfully and can host behavior tests; actual command results are recorded in task history.",
  "Existing description, bootstrap metadata, and repository history are retained."
]

[[milestones.tasks]]
id = "m1-t2"
title = "Create and display habits with helpful empty and validation states"
size = "m"
depends_on = ["m1-t1"]
fulfills = ["VAL-HABIT-001", "VAL-EMPTY-001"]
acceptance_criteria = [
  "A named habit appears in a clear list after submission, and multiple habits remain individually identifiable.",
  "Empty and whitespace-only names create no habit and show a correctable, understandable validation message associated with the input.",
  "The initial empty state explains how to add a first habit and disappears when a habit is created.",
  "Meaningful automated creation, invalid-input, correction, and empty-state tests are implemented and run with recorded results."
]

[[milestones.tasks]]
id = "m1-t3"
title = "Track independent completion for each local calendar day"
size = "m"
depends_on = ["m1-t2"]
fulfills = ["VAL-DAY-001"]
acceptance_criteria = [
  "Each habit can be checked and unchecked independently with a named control, an exposed state, and a completion indication understandable without color.",
  "The current day follows the user's local calendar, including rollover while the app remains open; changing one day does not overwrite another day's state.",
  "Automated tests exercise independent toggles, unchecking, differing local and UTC dates, day rollover, and revisiting earlier dates; actual results are recorded."
]

[[milestones.tasks]]
id = "m1-t4"
title = "Verify and document the usable daily tracker"
size = "m"
depends_on = ["m1-t3"]
fulfills = ["VAL-ACCESS-001", "VAL-DELIVERY-001"]
acceptance_criteria = [
  "Keyboard-only creation, validation correction, and toggling work with logical focus, visible focus, accessible names, and exposed states; defects are fixed before completion.",
  "Automated core behavior and accessibility semantics checks run successfully; manual keyboard and focus checks are recorded separately with actual observations.",
  "Prerequisites, install, startup, and test commands are documented and exercised, with milestone 1's temporary in-memory persistence limitation stated accurately.",
  "Implementation revision, executed commands and results, and an end-to-end demonstration are recorded in Flow/task history before milestone 2 begins."
]

[[milestones]]
id = "m2"
title = "Keep dated records across reloads and filter today's habits"

[[milestones.tasks]]
id = "m2-t1"
title = "Persist habits and dated completion with recoverable storage errors"
size = "m"
depends_on = ["m1-t4"]
fulfills = ["VAL-PERSIST-001", "VAL-PERSIST-002"]
acceptance_criteria = [
  "Created habits, checked and unchecked states, and records for multiple dates survive reload; another local day shows its own state and retains prior records.",
  "Read failures, invalid stored data, and write failures show understandable messages and an actionable recovery path, without silently overwriting unreadable data or claiming a failed save succeeded.",
  "Automated reload tests cover multiple habits and dates, and injected storage failures exercise recovery through a successful save and reload; actual results are recorded."
]

[[milestones.tasks]]
id = "m2-t2"
title = "Filter all, completed, and incomplete habits for today"
size = "m"
depends_on = ["m2-t1"]
fulfills = ["VAL-FILTER-001"]
acceptance_criteria = [
  "Clearly labeled All, Completed today, and Incomplete today controls expose their selected state and show the correct habits for the local day.",
  "Visible results respond to check/uncheck and date rollover; an empty filter explains that there are no matches and offers a way to return to all habits.",
  "Filtering does not discard habits or dated records, including when switching filters and then reloading.",
  "Automated tests cover all filter modes, live updates, rollover, both empty states, and the filtering/reload flow; actual results are recorded."
]

[[milestones.tasks]]
id = "m2-t3"
title = "Verify accessible interaction across filtering and recovery"
size = "m"
depends_on = ["m2-t2"]
fulfills = ["VAL-ACCESS-002"]
acceptance_criteria = [
  "Creation, validation correction, independent toggles, filters, and recovery are keyboard operable with logical focus order, visible focus, accessible names, and programmatically exposed states.",
  "Focus remains usable when toggling removes a habit from the current filter, and status and errors remain understandable without color alone.",
  "Relevant automated keyboard and semantics tests pass, a manual keyboard-only walkthrough checks visible focus and full flows, and defects are fixed with actual results recorded separately for automated and manual checks."
]

[[milestones.tasks]]
id = "m2-t4"
title = "Deliver reproducible local use and complete milestone evidence"
size = "m"
depends_on = ["m2-t3"]
fulfills = ["VAL-LOCAL-001", "VAL-DELIVERY-002", "VAL-FLOW-001"]
description = "Close the local release with verified documentation and a complete delivery record. Runtime and model are execution constraints on every generated agent stage from the outset, not a product feature to configure at this task."
acceptance_criteria = [
  "Final documentation gives prerequisites, installation, startup, and automated-test commands and explains persistence scope, date behavior, recovery, and material local-use limitations.",
  "The documented commands are exercised from a fresh checkout against the final revision, the complete automated suite runs, and actual commands, results, environment, and manual checks are recorded; unexecuted checks are not reported as passed.",
  "Every mission assertion has inspectable implementation or configuration evidence and actual check results; failures are resolved before delivery is marked complete.",
  "Generated Flow inspection confirms every agent stage explicitly uses runtime codex-acp and exact model gpt-6.1-sol; execution metadata is checked against these settings.",
  "Flow/task history contains implementation revisions and verification results for both ordered milestones, and earlier project history and generated artifacts remain available for the separate follow-up."
]

[[dependencies]]
from = "m1"
to = "m2"
reason = "The usable daily tracker must be implemented and verified before adding persistence and filtering."

[[risks]]
description = "UTC-based dates or a stale open page could assign completion to the wrong local day."
mitigation = "Verify local versus UTC boundaries, open-page rollover, and revisiting earlier dates with controlled-date tests."

[[risks]]
description = "Unavailable, full, or malformed local storage could lose records or falsely imply a successful save."
mitigation = "Test read, parse, and write failures, communicate unsaved state accurately, and verify an explicit recovery path without silent overwrite."

[[risks]]
description = "Dynamic filtering could hide the focused control or leave keyboard users unable to understand state changes."
mitigation = "Test keyboard interaction and exposed states, and manually inspect focus visibility and behavior when a habit leaves the active filter."

[[risks]]
description = "A summary or green partial check could be mistaken for completed delivery, or generated stages could inherit the wrong agent settings."
mitigation = "Gate each milestone on actual implementation and check evidence, inspect every stage's explicit codex-acp and gpt-6.1-sol settings, and retain artifacts and revision-linked results."
