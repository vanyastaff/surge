[package]
name = "surge-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
surge-process = { workspace = true }
surge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

# M2 additions
r2d2 = { workspace = true }
scheduled-thread-pool = { workspace = true }
r2d2_sqlite = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
futures-core = "0.3"
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
sysinfo = { workspace = true }
rand = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
futures = "0.3"
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Ioctl", "Win32_System_SystemServices"] }
