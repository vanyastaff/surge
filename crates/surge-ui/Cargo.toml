[package]
name = "surge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GUI for Surge — GPUI-based desktop application"

[dependencies]
gpui-kit.workspace = true
cap-std.workspace = true
percent-encoding.workspace = true

surge-core = { path = "../surge-core" }
surge-acp = { path = "../surge-acp" }
surge-orchestrator = { path = "../surge-orchestrator" }
surge-daemon = { path = "../surge-daemon" }
surge-persistence = { path = "../surge-persistence" }
agent-client-protocol.workspace = true

tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pulldown-cmark = "0.12"
chrono = { workspace = true }
notify-rust = { workspace = true }
git2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui-wry.workspace = true
wry.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-support` unlocks `TestAppContext`/`add_window_view` for the screen
# smoke tests (src/screens/smoke_test.rs). Dev-only: it is never active for
# `cargo build`/`cargo run`, only for `cargo test`/nextest.
gpui-kit = { workspace = true, features = ["test-support"] }
