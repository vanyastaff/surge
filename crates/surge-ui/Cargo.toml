[package]
name = "surge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GUI for Surge — GPUI-based desktop application"

[dependencies]
# `gpui-pre` is the published snapshot of zed's gpui that gpui-component
# 0.6 links as its `gpui` — depending on the same crate (instead of the
# old gpui 0.2) keeps exactly ONE `gpui` in the graph. `gpui-pre-platform`
# provides the `application()` entrypoint (windowing + text backends).
gpui = { version = "0.3.5", package = "gpui-pre", features = ["wayland", "x11"] }
gpui-platform = { version = "0.3.5", package = "gpui-pre-platform", features = ["wayland", "x11"] }
# The unstyled motion layer (Transition/transition, Spring, keyframes) the
# styled gpui-component layers its own motion on — same version pin as the
# component crate so the two always move together.
gpui-base = "0.6"
gpui-component = "0.6"
gpui-kit-assets = "0.6"

surge-core = { path = "../surge-core" }
surge-acp = { path = "../surge-acp" }
surge-orchestrator = { path = "../surge-orchestrator" }
surge-daemon = { path = "../surge-daemon" }
surge-persistence = { path = "../surge-persistence" }
agent-client-protocol.workspace = true

tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pulldown-cmark = "0.12"
chrono = { workspace = true }
notify-rust = { workspace = true }

[dev-dependencies]
# `test-support` unlocks `TestAppContext`/`add_window_view` for the screen
# smoke tests (src/screens/smoke_test.rs). Dev-only: it is never active for
# `cargo build`/`cargo run`, only for `cargo test`/nextest.
# Same package as the main `gpui` dependency — dev-only features of the
# same version just re-unify.
gpui = { version = "0.3.5", package = "gpui-pre", features = ["test-support"] }
