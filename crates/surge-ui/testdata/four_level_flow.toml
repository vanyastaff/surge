schema_version = 1
start = "milestone_loop"

[metadata]
name = "pomodoro-timer"
created_at = "2026-09-28T00:00:00Z"

[metadata.archetype]
name = "multi-milestone"

# ── Outer milestone loop ────────────────────────────────────────────

[nodes.milestone_loop]
id = "milestone_loop"

[[nodes.milestone_loop.declared_outcomes]]
id = "completed"
description = "All milestones completed"
edge_kind_hint = "forward"
is_terminal = false

[nodes.milestone_loop.position]
x = 0.0
y = 0.0

[nodes.milestone_loop.config]
node_kind = "loop"
body = "milestone_body"
iteration_var_name = "milestone"
parallelism = "sequential"
gate_after_each = false

[nodes.milestone_loop.config.iterates_over]
type = "run_artifact"

[nodes.milestone_loop.config.iterates_over.value]
name = "roadmap"
jsonpath = "milestones"

[nodes.milestone_loop.config.exit_condition]
type = "all_items"

[nodes.milestone_loop.config.on_iteration_failure]
type = "abort"

# ── Final integration verification ──────────────────────────────────

[nodes.final_spec]
id = "final_spec"

[[nodes.final_spec.declared_outcomes]]
id = "drafted"
description = "Integration spec drafted"
edge_kind_hint = "forward"
is_terminal = false

[[nodes.final_spec.declared_outcomes]]
id = "needs_clarification"
description = "Needs clarification"
edge_kind_hint = "escalate"
is_terminal = false

[nodes.final_spec.position]
x = 320.0
y = 0.0

[nodes.final_spec.config]
node_kind = "agent"
profile = "spec-author@1.0"

[[nodes.final_spec.config.bindings]]
target = "milestone"
optional = false

[nodes.final_spec.config.bindings.source]
type = "run_artifact"
name = "roadmap"

[nodes.final_verify]
id = "final_verify"

[[nodes.final_verify.declared_outcomes]]
id = "passed"
description = "Final verification passed"
edge_kind_hint = "forward"
is_terminal = false
ledger_effect = "verified"

[[nodes.final_verify.declared_outcomes]]
id = "failed"
description = "Final verification failed"
edge_kind_hint = "escalate"
is_terminal = false
ledger_effect = "failed_verification"

[nodes.final_verify.position]
x = 640.0
y = 0.0

[nodes.final_verify.config]
node_kind = "agent"
profile = "cross-verifier@1.0"

[[nodes.final_verify.config.bindings]]
target = "spec"
optional = false

[nodes.final_verify.config.bindings.source]
type = "node_output"
node = "final_spec"
artifact = "spec_toml"

# ── Terminal nodes ──────────────────────────────────────────────────

[nodes.end]
id = "end"
declared_outcomes = []

[nodes.end.position]
x = 960.0
y = 0.0

[nodes.end.config]
node_kind = "terminal"

[nodes.end.config.kind]
type = "success"

[nodes.review_failed]
id = "review_failed"
declared_outcomes = []

[nodes.review_failed.position]
x = 960.0
y = 180.0

[nodes.review_failed.config]
node_kind = "terminal"

[nodes.review_failed.config.kind]
type = "failure"
exit_code = 1

# ── Top-level edges ─────────────────────────────────────────────────

[[edges]]
id = "e_milestones_done"
to = "final_spec"
kind = "forward"

[edges.from]
node = "milestone_loop"
outcome = "completed"

[edges.policy]
on_max_exceeded = "escalate"

[[edges]]
id = "e_final_spec"
to = "final_verify"
kind = "forward"

[edges.from]
node = "final_spec"
outcome = "drafted"

[edges.policy]
on_max_exceeded = "escalate"

[[edges]]
id = "e_final_unclear"
to = "review_failed"
kind = "forward"

[edges.from]
node = "final_spec"
outcome = "needs_clarification"

[edges.policy]
on_max_exceeded = "escalate"

[[edges]]
id = "e_final_passed"
to = "end"
kind = "forward"

[edges.from]
node = "final_verify"
outcome = "passed"

[edges.policy]
on_max_exceeded = "escalate"

[[edges]]
id = "e_final_failed"
to = "review_failed"
kind = "forward"

[edges.from]
node = "final_verify"
outcome = "failed"

[edges.policy]
on_max_exceeded = "escalate"

